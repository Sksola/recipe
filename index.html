<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灶腳手帖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F5F1;
  --surface:#FFFFFF;
  --surface-2:#EFEDE6;
  --ink:#2B2622;
  --ink-soft:#6E655B;
  --line:#DDD8CC;
  --accent:#A65E12;
  --accent-soft:#F3E4CF;
  --green:#3E7A45;
  --green-soft:#E3EEE2;
  --fire-hi:#C24A2E;   --fire-hi-bg:#F7E3DC;
  --fire-mid:#B07C10;  --fire-mid-bg:#F5EAD0;
  --fire-lo:#7C6F4E;   --fire-lo-bg:#ECE8DC;
  --fire-off:#6E655B;  --fire-off-bg:#E8E5DE;
  --done:#9C948A;
  --shadow:0 1px 3px rgba(43,38,34,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191613;
    --surface:#221E1A;
    --surface-2:#2B2620;
    --ink:#EAE4DA;
    --ink-soft:#A79C8E;
    --line:#3A342C;
    --accent:#D98A33;
    --accent-soft:#3B2D1B;
    --green:#7CB183;
    --green-soft:#233527;
    --fire-hi:#E07A5F;   --fire-hi-bg:#3C2620;
    --fire-mid:#D9A93F;  --fire-mid-bg:#38301B;
    --fire-lo:#B3A57E;   --fire-lo-bg:#302C22;
    --fire-off:#A79C8E;  --fire-off-bg:#2C2822;
    --done:#6E655B;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#191613;
  --surface:#221E1A;
  --surface-2:#2B2620;
  --ink:#EAE4DA;
  --ink-soft:#A79C8E;
  --line:#3A342C;
  --accent:#D98A33;
  --accent-soft:#3B2D1B;
  --green:#7CB183;
  --green-soft:#233527;
  --fire-hi:#E07A5F;   --fire-hi-bg:#3C2620;
  --fire-mid:#D9A93F;  --fire-mid-bg:#38301B;
  --fire-lo:#B3A57E;   --fire-lo-bg:#302C22;
  --fire-off:#A79C8E;  --fire-off-bg:#2C2822;
  --done:#6E655B;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:17px;
  line-height:1.7;
  margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 80px}
.kai{font-family:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif}

/* ── header ── */
header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:2rem;margin:0;letter-spacing:.06em}
.tagline{color:var(--ink-soft);font-size:.95rem}
.searchrow{display:flex;gap:10px;margin:18px 0 12px}
.search{
  flex:1;
  font:inherit;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 16px;
}
.search:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.search::placeholder{color:var(--ink-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{
  font:inherit;font-size:.95rem;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  border-radius:999px;
  padding:5px 16px;
  cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── recipe cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{
  text-align:left;
  font:inherit;color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 20px 16px;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;
}
.card:hover{border-color:var(--accent)}
.card h2{font-size:1.5rem;margin:0;font-weight:400;letter-spacing:.04em}
.card .meta{display:flex;gap:14px;color:var(--ink-soft);font-size:.9rem;font-variant-numeric:tabular-nums}
.card .desc{color:var(--ink-soft);font-size:.92rem;line-height:1.6;margin:0}
.empty{color:var(--ink-soft);padding:40px 0;text-align:center}

/* ── detail ── */
.backrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.backbtn,.wakebtn{
  font:inherit;font-size:.95rem;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:7px 16px;
  cursor:pointer;
}
.wakebtn{margin-left:auto;color:var(--ink-soft)}
.wakebtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.detail h2{font-size:2.2rem;margin:4px 0 6px;font-weight:400;letter-spacing:.05em;text-wrap:balance}
.detail .meta{display:flex;gap:20px;color:var(--ink-soft);flex-wrap:wrap;font-variant-numeric:tabular-nums;margin-bottom:6px}
.detail .meta b{color:var(--ink);font-weight:500}
.note{
  background:var(--accent-soft);
  color:var(--accent);
  border-radius:10px;
  padding:10px 16px;
  font-size:.95rem;
  margin:12px 0 0;
}
.cols{display:grid;grid-template-columns:300px 1fr;gap:28px;margin-top:26px;align-items:start}
@media (max-width:720px){.cols{grid-template-columns:1fr}}

h3.sec{
  font-size:.85rem;font-weight:700;letter-spacing:.18em;
  color:var(--ink-soft);text-transform:uppercase;
  margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
}
/* ingredients */
.ing-group{margin-bottom:18px}
.ing-group .glabel{font-size:.85rem;color:var(--accent);letter-spacing:.1em;margin-bottom:6px}
ul.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.ings li{border-bottom:1px dashed var(--line)}
ul.ings label{
  display:flex;align-items:baseline;gap:10px;
  padding:8px 2px;cursor:pointer;
}
ul.ings input{width:18px;height:18px;accent-color:var(--accent);flex:none;transform:translateY(3px)}
ul.ings .iname{flex:1}
ul.ings .amt{color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
ul.ings input:checked ~ .iname,ul.ings input:checked ~ .amt{color:var(--done);text-decoration:line-through}

/* steps */
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:step}
ol.steps li{counter-increment:step}
ol.steps button{
  width:100%;text-align:left;font:inherit;color:var(--ink);
  display:flex;gap:14px;align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
  cursor:pointer;
  line-height:1.65;
  font-size:1.06rem;
}
ol.steps button::before{
  content:counter(step);
  font-family:"LXGW WenKai TC",serif;
  font-size:1.5rem;line-height:1.1;
  color:var(--accent);
  min-width:1.4em;text-align:center;
  flex:none;
}
ol.steps button.done{color:var(--done);background:var(--surface-2);border-color:transparent}
ol.steps button.done::before{color:var(--done)}
ol.steps .sbody{flex:1;display:flex;flex-direction:column;gap:4px}
.fire{
  align-self:flex-start;
  font-size:.78rem;letter-spacing:.08em;
  border-radius:6px;padding:1px 8px;font-weight:500;
}
.fire.hi{color:var(--fire-hi);background:var(--fire-hi-bg)}
.fire.mid{color:var(--fire-mid);background:var(--fire-mid-bg)}
.fire.lo{color:var(--fire-lo);background:var(--fire-lo-bg)}
.fire.off{color:var(--fire-off);background:var(--fire-off-bg)}
ol.steps button.done .fire{color:var(--done);background:var(--surface-2)}

.tips{margin-top:24px;background:var(--green-soft);border-radius:12px;padding:14px 18px}
.tips .tlabel{color:var(--green);font-weight:700;font-size:.85rem;letter-spacing:.15em;margin-bottom:4px}
.tips p{margin:0;color:var(--ink);font-size:.97rem}
.tips p + p{margin-top:6px}

footer{margin-top:48px;color:var(--ink-soft);font-size:.85rem;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .card,.chip,ol.steps button{transition:border-color .15s,background .15s,color .15s}
}
</style>
</head>
<body>

<div class="wrap">
  <div id="listview">
    <header class="top">
      <h1 class="kai">灶腳手帖</h1>
      <span class="tagline">做菜時的快速參考 — 點進食譜，食材打勾備料、步驟點一下標記完成</span>
    </header>
    <div class="searchrow">
      <input class="search" id="q" type="search" placeholder="搜尋菜名或食材，例如：雞、九層塔…" aria-label="搜尋食譜">
    </div>
    <div class="chips" id="chips" role="group" aria-label="分類篩選"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>找不到符合的食譜，換個關鍵字試試。</p>
  </div>

  <div id="detailview" class="detail" hidden></div>

  <footer>單位換算：1 大匙 = 15ml　1 小匙 = 5ml　1 米杯 = 180ml</footer>
</div>

<script>

{

const CATS = ["全部","快速","快炒","滷燉","湯品","蛋料理","蔬菜"];
let activeCat = "全部";
let query = "";

const $grid = document.getElementById("grid");
const $chips = document.getElementById("chips");
const $empty = document.getElementById("empty");
const $list = document.getElementById("listview");
const $detail = document.getElementById("detailview");
const $q = document.getElementById("q");

function store(key, val){ try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null"); localStorage.setItem(key, JSON.stringify(val)); }catch(e){ return null; } }

/* ── chips ── */
CATS.forEach(c=>{
  const b=document.createElement("button");
  b.className="chip"; b.textContent=c;
  b.setAttribute("aria-pressed", c===activeCat);
  b.onclick=()=>{ activeCat=c; [...$chips.children].forEach(x=>x.setAttribute("aria-pressed", x.textContent===c)); renderList(); };
  $chips.appendChild(b);
});

/* ── list ── */
function matches(r){
  if(activeCat!=="全部" && !r.cats.includes(activeCat)) return false;
  if(!query) return true;
  const hay=[r.name, r.desc, ...r.ings.map(i=>i[0]),
    ...(r.ingGroups||[]).flatMap(g=>g[1].map(i=>i[0]))].join(" ");
  return hay.includes(query);
}
function renderList(){
  const rs=RECIPES.filter(matches);
  $grid.innerHTML="";
  rs.forEach(r=>{
    const b=document.createElement("button");
    b.className="card";
    b.innerHTML=`<h2 class="kai">${r.name}</h2>
      <div class="meta"><span>⏱ ${r.time}</span><span>${r.serves}</span></div>
      <p class="desc">${r.desc}</p>`;
    b.onclick=()=>{ location.hash="r/"+r.id; };
    $grid.appendChild(b);
  });
  $empty.hidden = rs.length>0;
}
$q.addEventListener("input", e=>{ query=e.target.value.trim(); renderList(); });

/* ── detail ── */
const FIRE={hi:"大火",mid:"中火",lo:"小火",off:"備料 / 關火"};
function ingRow(r, idx, name, amt, checked){
  return `<li><label>
    <input type="checkbox" data-idx="${idx}" ${checked?"checked":""}>
    <span class="iname">${name}</span><span class="amt">${amt}</span>
  </label></li>`;
}
function renderDetail(r){
  const ingState = store("ing-"+r.id) || [];
  const stepState = store("step-"+r.id) || [];
  let i=0;
  let ingHTML = `<div class="ing-group"><ul class="ings">` +
    r.ings.map(([n,a])=>ingRow(r,i,n,a,ingState[i++])).join("") + `</ul></div>`;
  (r.ingGroups||[]).forEach(([label,items])=>{
    ingHTML += `<div class="ing-group"><div class="glabel kai">${label}</div><ul class="ings">` +
      items.map(([n,a])=>ingRow(r,i,n,a,ingState[i++])).join("") + `</ul></div>`;
  });
  $detail.innerHTML=`
    <div class="backrow">
      <button class="backbtn" id="back">← 回列表</button>
      <button class="wakebtn" id="wake" aria-pressed="false" hidden>☀ 螢幕常亮</button>
    </div>
    <h2 class="kai">${r.name}</h2>
    <div class="meta"><span>時間 <b>${r.time}</b></span><span>份量 <b>${r.serves}</b></span></div>
    <div class="cols">
      <aside>
        <h3 class="sec">食材 · 打勾備料</h3>
        ${ingHTML}
      </aside>
      <main>
        <h3 class="sec">步驟 · 點一下標記完成</h3>
        <ol class="steps">
          ${r.steps.map(([f,t],si)=>`<li><button data-si="${si}" class="${stepState[si]?"done":""}">
            <span class="sbody"><span class="fire ${f}">${FIRE[f]}</span><span>${t}</span></span>
          </button></li>`).join("")}
        </ol>
        <div class="tips">
          <div class="tlabel">小訣竅</div>
          ${r.tips.map(t=>`<p>${t}</p>`).join("")}
        </div>
      </main>
    </div>`;
  document.getElementById("back").onclick=()=>{ location.hash=""; };
  $detail.querySelectorAll(".ings input").forEach(cb=>{
    cb.addEventListener("change",()=>{
      const s=store("ing-"+r.id)||[];
      s[+cb.dataset.idx]=cb.checked;
      store("ing-"+r.id,s);
    });
  });
  $detail.querySelectorAll(".steps button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      btn.classList.toggle("done");
      const s=store("step-"+r.id)||[];
      s[+btn.dataset.si]=btn.classList.contains("done");
      store("step-"+r.id,s);
    });
  });
  setupWakeLock();
}

/* ── wake lock（做菜時螢幕不熄屏）── */
let wakeLock=null;
function setupWakeLock(){
  const btn=document.getElementById("wake");
  if(!("wakeLock" in navigator)) return;
  btn.hidden=false;
  btn.onclick=async()=>{
    try{
      if(wakeLock){ await wakeLock.release(); wakeLock=null; }
      else{
        wakeLock=await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release",()=>{ wakeLock=null; btn.setAttribute("aria-pressed","false"); });
      }
      btn.setAttribute("aria-pressed", wakeLock?"true":"false");
    }catch(e){ btn.hidden=true; }
  };
}

/* ── routing ── */
function route(){
  const m=location.hash.match(/^#r\/(.+)$/);
  const r=m && RECIPES.find(x=>x.id===decodeURIComponent(m[1]));
  if(r){ $list.hidden=true; $detail.hidden=false; renderDetail(r); window.scrollTo(0,0); }
  else{ $detail.hidden=true; $list.hidden=false; renderList(); }
}
window.addEventListener("hashchange", route);
route();
</script>
